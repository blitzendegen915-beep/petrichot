name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 誇大表現・捏造URL・成果の保証などを検出する。ERRORが1件でもあれば
      # 公開せずにここで止める(WARNは人の目視確認用なので落とさない)。
      - name: Lint content
        run: |
          node affiliate/lint.mjs
          node learning/lint.mjs

      - name: Build site
        run: |
          # ルート側がdistを初期化するため、必ず AI → Learning → Shopping の順で生成する。
          node affiliate/build.mjs
          node learning/build.mjs
          node shopping/build.mjs
          node shopping/check.mjs
          test -f dist/index.html
          test -f dist/learning/index.html
          test -f dist/shopping/index.html

      - name: Deploy to gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          # カスタムドメイン設定を保持する。gh-pagesブランチは毎回作り直しているため、
          # GitHubのUIが生成するCNAMEファイルはforce pushで消えてしまう。ここで必ず作る。
          echo "petrichot.com" > CNAME
          git init -b gh-pages
          git config user.name "affiliate-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
